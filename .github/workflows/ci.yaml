name: CI

on:
  pull_request:
    branches: [ 'main' ]
  push:
    branches:
      - 'feature/*'

# Cancel any previous runs for the same ref when a new run is started
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Yarn version comes from the "packageManager" field in package.json
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '20.x', '22.x', '24.x' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # `yarn build` runs the TypeScript project build (tsc -b) before bundling
      - name: Build
        run: yarn build

      - name: Test
        run: yarn test --run
